name = "cors-proxy"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-30"
send_metrics = false
preview_urls = false

kv_namespaces = [{ binding = "default", preview_id = "33d9797dab5e4949ab3851100534a7cf", id = "89fee0bb99ba4c0fa78c48c256ba74b3" }]
build = { command = "worker-build --release" }

[env.dev]
kv_namespaces = [{ binding = "default", preview_id = "33d9797dab5e4949ab3851100534a7cf", id = "89fee0bb99ba4c0fa78c48c256ba74b3" }]
build = { command = "worker-build --dev --features console_error_panic_hook" }

#[env.prod]
#name = "cors-proxy" # Without this, the name is cors-proxy-prod.

